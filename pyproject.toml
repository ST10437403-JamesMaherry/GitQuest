[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gitquest"
version = "0.4.0"
description = "A local-first Git and DevSecOps incident-response simulator."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "James Maherry" },
]
dependencies = [
    "rich>=15.0.0,<16.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2.0",
    "pytest>=8.0,<9.0",
    "ruff>=0.6,<1.0",
]

[project.scripts]
gitquest = "gitquest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gitquest = ["web/*.html", "web/*.css", "web/*.js", "web/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
